default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: knowledge_vault_development
  cache:
    <<: *default
    database: knowledge_vault_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: knowledge_vault_development_queue
    migrations_paths: db/queue_migrate

# The test database is disposable and is prepared from the checked-in schema.
test:
  <<: *default
  database: knowledge_vault_test

# DATABASE_URL, CACHE_DATABASE_URL, QUEUE_DATABASE_URL, and
# CABLE_DATABASE_URL can point to separate databases on the same PostgreSQL server.
production:
  primary: &primary_production
    <<: *default
    database: knowledge_vault_production
  cache:
    <<: *primary_production
    database: knowledge_vault_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: knowledge_vault_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: knowledge_vault_production_cable
    migrations_paths: db/cable_migrate
